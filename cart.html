<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping Cart | Nordic Living</title>

<link rel="stylesheet" href="style.css">

<style>

.cart-page{
    width:84%;
    margin:auto;
    padding:100px 0;
}

.cart-page h1{
    font-size:48px;
    margin-bottom:40px;
}

.cart-wrapper{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:40px;
}

.cart-items{
    background:#f8f4ee;
    border-radius:24px;
    padding:20px 30px;

    box-shadow:0 10px 25px rgba(0,0,0,.05);
}

.cart-item{
    display:flex;
    gap:25px;
    align-items:center;
    padding:25px 0;
    border-bottom:1px solid rgba(0,0,0,.08);
}

.cart-item:last-child{
    border-bottom:none;
}

.cart-item img{
    width:140px;
    height:140px;
    object-fit:cover;
    border-radius:16px;
}

.item-info{
    flex:1;
}

.item-info h3{
    margin-bottom:10px;
}

.item-info p{
    color:#777;
}

.item-price{
    font-size:24px;
    font-weight:bold;
    color:#8b6f47;
    min-width:120px;
    text-align:right;
}

.quantity-control{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:15px;
}

.quantity-control button{
    width:36px;
    height:36px;

    border:none;
    border-radius:10px;

    background:#8b6f47;
    color:white;

    font-size:18px;
    font-weight:bold;

    cursor:pointer;
    transition:.3s;
}

.quantity-control button:hover{
    background:#725938;
}

.quantity-control span{
    min-width:30px;
    text-align:center;
    font-weight:600;
    font-size:16px;
}

.summary{
    background:#f8f4ee;
    border-radius:24px;
    padding:30px;
    height:fit-content;

    box-shadow:0 10px 25px rgba(0,0,0,.05);
}

.summary h2{
    margin-bottom:25px;
}

.summary-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
}

.total{
    border-top:1px solid rgba(0,0,0,.1);
    margin-top:20px;
    padding-top:20px;

    font-size:22px;
    font-weight:bold;
}

.checkout-btn{
    width:100%;
    border:none;

    margin-top:25px;
    padding:18px;

    border-radius:12px;

    background:#8b6f47;
    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;
    transition:.3s;
}

.checkout-btn:hover{
    background:#725938;
}

.continue{
    display:block;
    text-align:center;

    margin-top:15px;

    color:#666;
    text-decoration:none;
}

@media(max-width:992px){

    .cart-wrapper{
        grid-template-columns:1fr;
    }

}

@media(max-width:768px){

    .cart-page h1{
        font-size:36px;
    }

    .cart-item{
        flex-direction:column;
        text-align:center;
    }

}

</style>

</head>
<body>

<nav>

    <h2 class="logo">Nordic Living</h2>

    <ul class="nav-menu">
        <li><a href="index.html">Home</a></li>
    </ul>

</nav>

<section class="cart-page">

    <h1>Shopping Cart</h1>

    <div class="cart-wrapper">

        <div class="cart-items">

            <div class="cart-item">

                <img src="img/sofa.jpg" alt="Nordic Sofa">

                <div class="item-info">

                    <h3>Nordic Sofa</h3>

                    <p>
                        Premium Scandinavian sofa
                        for modern living spaces.
                    </p>

                    <div class="quantity-control">

                <button>-</button>
                <span>1</span>
                <button>+</button>
                </div>

                <div class="item-price">
                    $1,299
                </div>

            </div>

        </div>

        <div class="summary">

            <h2>Order Summary</h2>

            <div class="summary-row">
                <span>Subtotal</span>
                <span>$1,299</span>
            </div>

            <div class="summary-row">
                <span>Shipping</span>
                <span>Free</span>
            </div>

            <div class="summary-row total">
                <span>Total</span>
                <span>$1,299</span>
            </div>

            <a href="checkout.html" class="cart-btn">
                Proceed To Checkout
            </a>

            <a href="index.html" class="continue">
                Continue Shopping
            </a>

        </div>

    </div>

</section>

</body>
</html>
